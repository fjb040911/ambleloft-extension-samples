<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>团队任务演示</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">LOCAL WORKSPACE</span>
        <h1 data-text="title"></h1>
        <p data-text="intro"></p>
      </header>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="grid">
        <section class="wide">
          <h2 data-text="projects"></h2>
          <p id="empty" data-text="empty"></p>
          <div class="row">
            <label
              ><span data-text="taskTitle"></span
              ><input id="task-title" maxlength="120" value="团队周报 · Weekly review" /></label
            ><button id="add" class="primary" data-text="add"></button>
          </div>
          <label
            ><span data-text="tasks"></span
            ><select id="tasks"></select
          ></label>
          <p id="project"></p>
          <div class="row">
            <button id="summary" data-text="summary"></button
            ><button id="remove-task" data-text="removeTask"></button>
          </div>
          <div id="chat-form">
            <h3 data-text="newChat"></h3>
            <label
              ><span data-text="chatTitle"></span
              ><input id="chat-title" maxlength="120" value="下一步计划 · Next steps" /></label
            ><label
              ><span data-text="prompt"></span
              ><textarea id="prompt" maxlength="20000">
请整理本地团队任务的下一步。</textarea
              ></label
            ><button id="create" class="primary" data-text="create"></button>
            <p data-text="createHint"></p>
            <p id="pending" role="alert" hidden data-text="pending"></p>
            <button id="ack" hidden data-text="ack"></button>
            <h3 data-text="linkedChats"></h3>
            <label
              ><span data-text="selectChat"></span
              ><select id="chats"></select
            ></label>
            <div class="row">
              <button id="open" data-text="open"></button
              ><button id="unlink" data-text="unlink"></button>
            </div>
            <p data-text="archiveHint"></p>
          </div>
        </section>
        <section>
          <h2 data-text="notices"></h2>
          <label
            ><span data-text="event"></span
            ><input id="event" value="weekly:ready:1" maxlength="200" /></label
          ><label
            ><span data-text="noticeTitle"></span
            ><input
              id="notice-title"
              value="团队任务已准备 · Team task ready"
              maxlength="120" /></label
          ><label
            ><span data-text="body"></span
            ><textarea id="body" maxlength="20000">任务说明 · Task details</textarea>
          </label>
          <div class="row">
            <button id="publish" class="primary" data-text="publish"></button
            ><button id="query" data-text="query"></button
            ><button id="update" data-text="update"></button
            ><button id="withdraw" data-text="withdraw"></button
            ><button id="preferences" data-text="preferences"></button>
          </div>
          <p id="notice-result" role="status"></p>
          <p data-text="noticeHint"></p>
        </section>
        <section>
          <h2 data-text="service"></h2>
          <p id="connection"></p>
          <div class="row">
            <button id="connect" data-text="connect"></button
            ><button id="disconnect" data-text="disconnect"></button>
          </div>
          <p data-text="serviceHint"></p>
          <h3 data-text="settings"></h3>
          <p data-text="settingsHint"></p>
          <p id="effective"></p>
          <p data-text="account"></p>
        </section>
        <section class="wide">
          <h2 data-text="runtime"></h2>
          <p id="runtime"></p>
          <button id="refresh" data-text="refresh"></button>
          <details>
            <summary data-text="developer"></summary>
            <p data-text="safeHint"></p>
            <div class="row">
              <button id="secret-input" data-text="secretInput"></button
              ><button id="secret-status" data-text="secretStatus"></button
              ><button id="secret-delete" data-text="secretDelete"></button
              ><button id="kv" data-text="kv"></button><button id="path" data-text="path"></button
              ><button id="cancel" data-text="cancel"></button>
            </div>
            <pre id="receipt"></pre>
          </details>
        </section>
      </div>
      <footer data-text="footer"></footer>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
